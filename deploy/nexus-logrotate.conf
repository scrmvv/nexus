# EXAMPLE: replace the path, group and owner for your installation.
/var/log/nginx/example.access.log {
    daily
    rotate 7
    missingok
    notifempty
    compress
    delaycompress
    create 0640 root nexus
    sharedscripts
    postrotate
        # A successful rotation is useless if Nginx keeps writing to .1.
        # Validate the config and reload the service so workers reopen logs.
        # Do not swallow failures: they must be visible in logrotate output.
        /usr/sbin/nginx -t
        /bin/systemctl reload nginx
    endscript
}
