# EXAMPLE: replace the path, group and owner for your installation.
/var/log/nginx/example.access.log {
    daily
    rotate 7
    missingok
    notifempty
    compress
    delaycompress
    create 0640 root nexus
    sharedscripts
    postrotate
        /usr/sbin/nginx -s reopen >/dev/null 2>&1 || true
    endscript
}
