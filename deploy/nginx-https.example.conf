# Activate this file ONLY AFTER obtaining a TLS certificate.
# Save it as /etc/nginx/sites-available/nexus.scrmvv.space
server {
    listen 80;
    server_name nexus.scrmvv.space;
    location ^~ /.well-known/acme-challenge/ { root /var/www/nexus-acme; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name nexus.scrmvv.space;

    ssl_certificate /etc/letsencrypt/live/nexus.scrmvv.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nexus.scrmvv.space/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    auth_basic "NEXUS private dashboard";
    auth_basic_user_file /etc/nginx/.nexus_htpasswd;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location / {
        proxy_pass http://127.0.0.1:4317;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }
}
