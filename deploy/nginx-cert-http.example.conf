# Temporary HTTP-only config to obtain a TLS certificate safely via webroot.
# Save it as /etc/nginx/sites-available/nexus.scrmvv.space
server {
    listen 80;
    server_name nexus.scrmvv.space;
    location ^~ /.well-known/acme-challenge/ { root /var/www/nexus-acme; }
    location / { return 404; }
}
